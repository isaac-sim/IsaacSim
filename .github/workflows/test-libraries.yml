      - name: Download library build artifacts
        uses: actions/download-artifact@v4
        with:
          name: isaac-sim-libraries-${{ inputs.platform }}-${{ inputs.config }}
          path: _cmake_build/

      - name: Verify downloaded artifacts against build manifest
        run: |
          set -euo pipefail
          echo "=== Verifying artifact integrity ==="
          manifest="_cmake_build/artifact-manifest.txt"
          tarfile="_cmake_build/isaacsim-libraries-release.tar"
          if [ ! -f "$tarfile" ]; then
            echo "::error::Expected tar archive not found: $tarfile"
            ls -laR _cmake_build/ || true
            exit 1
          fi
          if [ -f "$manifest" ]; then
            echo "Manifest contents:"
            cat "$manifest"
            echo "---"
            errors=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              expected_sha=$(echo "$line" | awk '{print $1}')
              expected_size=$(echo "$line" | awk '{print $2}')
              filename=$(echo "$line" | awk '{print $3}')
