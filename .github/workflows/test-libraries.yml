name: Test Libraries

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      config:
        required: true
        type: string

jobs:
  test:
    name: "Test Libraries (${{ inputs.platform }} / ${{ inputs.config }})"
    runs-on: [self-hosted, gpu]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      OMNI_KIT_ALLOW_ROOT: 1
      PM_PACKAGES_ROOT: ${{ github.workspace }}/.cache/packman
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Ensure LFS files are smudged
        run: git lfs checkout

      - name: Clean checkout
        run: |
          git clean -fdx
          git reset --hard HEAD

      - name: Make all files user-writable
        run: chmod -R u+w .

      - name: Create caches
        run: mkdir -p "${{ github.workspace }}/.cache/packman"

      - name: Download library build artifacts
        uses: actions/download-artifact@v4
        with:
          name: isaac-sim-libraries-${{ inputs.platform }}-${{ inputs.config }}
          path: _cmake_build/

      - name: Verify downloaded artifacts against build manifest
        run: |
          set -euo pipefail
          echo "=== Verifying artifact integrity ==="
          manifest="_cmake_build/artifact-manifest.txt"
          tarfile="_cmake_build/isaacsim-libraries-release.tar"
          if [ ! -f "$tarfile" ]; then
            echo "::error::Expected tar archive not found: $tarfile"
            ls -laR _cmake_build/ || true
            exit 1
          fi
          if [ -f "$manifest" ]; then
            echo "Manifest contents:"
            cat "$manifest"
            echo "---"
            errors=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              expected_sha=$(echo "$line" | awk '{print $1}')
              expected_size=$(echo "$line" | awk '{print $2}')
              filename=$(echo "$line" | awk '{print $3}')
              actual_file=$(find _cmake_build/ -name "$filename" -print -quit)
              if [ -z "$actual_file" ]; then
                echo "::error::Manifest lists $filename but file not found on disk"
                errors=$((errors + 1))
                continue
              fi
              actual_size=$(stat -c%s "$actual_file")
              actual_sha=$(sha256sum "$actual_file" | cut -d' ' -f1)
              if [ "$actual_size" != "$expected_size" ] || [ "$actual_sha" != "$expected_sha" ]; then
                echo "::error::MISMATCH: $filename"
                echo "  expected: size=$expected_size  sha256=$expected_sha"
                echo "  actual:   size=$actual_size  sha256=$actual_sha"
                errors=$((errors + 1))
              else
                echo "  OK: $filename  size=$actual_size  sha256=$actual_sha"
              fi
            done < "$manifest"
            if [ "$errors" -gt 0 ]; then
              echo "::error::$errors artifact(s) failed integrity check — download was corrupted"
              echo "=== Disk usage (df -h) ==="
              df -h
              echo "=== Build directory listing ==="
              ls -lah _cmake_build/
              exit 1
            fi
            echo "All artifacts verified against build manifest ✓"
          else
            echo "::warning::No artifact-manifest.txt found — falling back to tar integrity check"
            echo "Checking: $tarfile ($(stat -c%s "$tarfile") bytes)"
            if ! tar -tf "$tarfile" > /dev/null; then
              echo "::error::Corrupt tar archive: $tarfile"
              exit 1
            fi
            echo "Archive verified OK (tar listing check only)"
          fi

      - name: GPU info
        run: |
          echo "=== GPU info ==="
          nvidia-smi || echo "nvidia-smi not available"

      - name: Extract library build artifacts
        run: tar -xpf _cmake_build/isaacsim-libraries-release.tar -C _cmake_build

      - name: Bootstrap Pixi environments
        run: |
          set -euo pipefail
          find . -type f -iname "*.sh" -exec chmod +x {} +
          ./source/libraries/build.sh --pull-only

      - name: Run library tests
        run: |
          set -euo pipefail
          set -x

          echo "::group::Test Libraries (${{ inputs.config }})"
          ./source/libraries/build.sh -r \
            --profile standard \
            --test-only \
            --test-timeout 600 \
            --exclude-test-regex '^tests-examples$' \
            --junit-output _cmake_build/isaacsim-libraries-release/source-libraries-tests.xml
          echo "::endgroup::"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-libraries-${{ inputs.platform }}-${{ inputs.config }}
          path: _cmake_build/isaacsim-libraries-release/source-libraries-*.xml
          retention-days: 7
        if: always()

      - name: Upload test logs (on failure)
        uses: actions/upload-artifact@v4
        with:
          name: test-libraries-logs-${{ inputs.platform }}-${{ inputs.config }}
          path: |
            _cmake_build/**/*.log
          retention-days: 7
        if: failure()

