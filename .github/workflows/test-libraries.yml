      - name: Bootstrap Pixi environments
        run: |
          set -euo pipefail
          find . -type f -iname "*.sh" -exec chmod +x {} +
          ./source/libraries/build.sh --pull-only

      - name: Run library consumer examples
        run: |
          set -euo pipefail
          set -x

          echo "::group::Test Library Examples (${{ inputs.config }})"
          ./source/libraries/build.sh -r \
            --profile standard \
            --test-only \
            --test-timeout 1800 \
            --test-regex '^tests-examples$' \
            --junit-output _cmake_build/isaacsim-libraries-release/source-libraries-examples-tests.xml
          echo "::endgroup::"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-libraries-examples-${{ inputs.platform }}-${{ inputs.config }}
          path: _cmake_build/isaacsim-libraries-release/source-libraries-examples-*.xml
          retention-days: 7
        if: always()

      - name: Upload test logs (on failure)
        uses: actions/upload-artifact@v4
        with:
          name: test-libraries-examples-logs-${{ inputs.platform }}-${{ inputs.config }}
          path: |
            _cmake_build/**/*.log
          retention-days: 7
        if: failure()
