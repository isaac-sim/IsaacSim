name: Test (Windows)

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      config:
        required: true
        type: string
      suite:
        required: true
        type: string
      bucket:
        required: false
        type: string
        default: ""

jobs:
  test:
    name: "Test (${{ inputs.suite }}${{ inputs.bucket != '' && format(':{0}', inputs.bucket) || '' }})"
    runs-on: [self-hosted, gpu-windows]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    env:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all

    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Clean checkout
        run: |
          git clean -fdx
          git reset --hard HEAD

      - name: Create short-path junction
        run: |
          if (Test-Path 'C:\b') {
            cmd /c "rmdir C:\b" 2>$null
            if (Test-Path 'C:\b') { Remove-Item -Recurse -Force 'C:\b' }
          }
          cmd /c "mklink /J C:\b ${{ github.workspace }}"
          Write-Host "Junction created: C:\b -> ${{ github.workspace }}"
          if (!(Test-Path 'C:\b\repo.bat')) {
            throw "Junction verification failed - repo.bat not found at C:\b\repo.bat"
          }

      - name: Patch repoman.py to respect OMNI_REPO_ROOT
        run: |
          python 'C:\b\.github\ci\patch_repoman.py'

      - name: Install VC++ Redistributable
        run: |
          Write-Host "Installing Visual C++ Redistributable 2015-2022..."
          $wingetAvailable = Get-Command winget -ErrorAction SilentlyContinue
          if ($wingetAvailable) {
            Write-Host "Using winget..."
            winget install Microsoft.VCRedist.2015+.x64 --silent --accept-package-agreements --accept-source-agreements
            if ($LASTEXITCODE -ne 0) {
              Write-Host "winget returned $LASTEXITCODE, trying direct download..."
            }
          }
          Write-Host "Downloading VC++ Redistributable directly..."
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "vc_redist.x64.exe"
          Start-Process -FilePath ".\vc_redist.x64.exe" -ArgumentList "/install","/quiet","/norestart" -Wait
          Write-Host "VC++ Redistributable installed."

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: isaac-sim-packages-${{ inputs.platform }}-${{ inputs.config }}
          path: C:\b\_build\packages\

      - name: Verify downloaded artifacts against build manifest
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '=== Verifying artifact integrity ==='
          $manifest = 'C:\b\_build\packages\artifact-manifest.txt'
          if (-not (Test-Path $manifest)) {
            Write-Host '::error::No artifact-manifest.txt found - build may not include manifest yet'
            Write-Host 'Falling back to basic existence check'
            $archives = Get-ChildItem -Path 'C:\b\_build\packages\' -Recurse -Include '*.7z','*.zip'
            if ($archives.Count -eq 0) {
              Write-Host '::error::No archives found in C:\b\_build\packages\'
              throw 'No archives found after download'
            }
            foreach ($f in $archives) {
              $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
              Write-Host ('  ' + $f.Name + '  size=' + $f.Length + '  sha256=' + $hash)
            }
            exit 0
          }
          Write-Host 'Manifest contents:'
          Get-Content $manifest
          Write-Host '---'
          $errors = 0
          foreach ($line in (Get-Content $manifest)) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            $parts = $line -split '\s+', 3
            $expectedSha = $parts[0]
            $expectedSize = [long]$parts[1]
            $filename = $parts[2]
            $actual = Get-ChildItem -Path 'C:\b\_build\packages\' -Recurse -Filter $filename | Select-Object -First 1
            if (-not $actual) {
              Write-Host "::error::Manifest lists $filename but file not found on disk"
              $errors++
              continue
            }
            $actualSize = $actual.Length
            $actualSha = (Get-FileHash -Path $actual.FullName -Algorithm SHA256).Hash.ToLower()
            if ($actualSize -ne $expectedSize -or $actualSha -ne $expectedSha) {
              Write-Host "::error::MISMATCH: $filename"
              Write-Host "  expected: size=$expectedSize  sha256=$expectedSha"
              Write-Host "  actual:   size=$actualSize  sha256=$actualSha"
              if ($actualSize -ne $expectedSize) {
                $diff = $expectedSize - $actualSize
                Write-Host "  size difference: $diff bytes"
              }
              $errors++
            } else {
              Write-Host "  OK: $filename  size=$actualSize  sha256=$actualSha"
            }
          }
          if ($errors -gt 0) {
            Write-Host '=== Disk usage ==='
            Get-PSDrive -PSProvider FileSystem | Format-Table Name,@{N='Used(GB)';E={[math]::Round($_.Used/1GB,1)}},@{N='Free(GB)';E={[math]::Round($_.Free/1GB,1)}} -AutoSize
            Write-Host '=== C:\b\_build\packages\ listing ==='
            Get-ChildItem 'C:\b\_build\packages\' | Format-Table Name,Length -AutoSize
            throw "$errors artifact(s) failed integrity check - download was corrupted"
          }
          Write-Host 'All artifacts verified against build manifest'

      - name: Accept EULA
        run: |
          New-Item -Path 'C:\b\.eula_accepted' -ItemType File -Force | Out-Null

      - name: Run tests
        working-directory: C:\b
        env:
          OMNI_REPO_ROOT: "C:\\b"
        run: |
          $ErrorActionPreference = 'Stop'

          $BucketCmd = @()
          if ("${{ inputs.bucket }}" -ne "") {
            $BucketCmd = @("-b", "${{ inputs.bucket }}")
          }

          Write-Host "::group::Test ${{ inputs.suite }} ${{ inputs.bucket }}"
          cmd /c "cd /d C:\b && set OMNI_REPO_ROOT=C:\b && C:\b\repo.bat ci test -- -s ${{ inputs.suite }} $($BucketCmd -join ' ') -e=--no-window"
          if ($LASTEXITCODE -ne 0) { throw "Tests failed with exit code $LASTEXITCODE" }
          Write-Host "::endgroup::"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows-${{ inputs.suite }}-${{ inputs.bucket || 'all' }}
          path: |
            C:\b\_build\packages\**\_testoutput\**
            C:\b\_build\packages\*\kit\logs\**
          retention-days: 7
        if: always()

      - name: Upload test logs (on failure)
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-windows-${{ inputs.suite }}-${{ inputs.bucket || 'all' }}
          path: |
            C:\b\_build\**\*.log
            C:\b\_repo\repo.log
            C:\b\_repo\repolog*.txt
          retention-days: 7
        if: failure()

      - name: Remove junction
        if: always()
        run: |
          if (Test-Path 'C:\b') { cmd /c "rmdir C:\b" }
