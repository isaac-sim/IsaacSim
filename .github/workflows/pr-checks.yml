name: PR Checks

on:
  push:
    branches:
      - 'pull-request/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  # ===========================================================================
  # Path Filter — ensure external PRs only touch allowed paths
  # ===========================================================================
  path-filter:
    name: "Path Filter"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PyYAML
        run: "python3 -m pip install --only-binary=:all: pyyaml==6.0.3"

      - name: Verify path policy documentation
        run: python3 tools/github/ci/generate_path_policy_docs.py --check

      - name: Run path filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Extract PR number from branch name (pull-request/123 -> 123)
          PR_NUMBER="${GITHUB_REF_NAME#pull-request/}" bash tools/github/ci/path_filter.sh
