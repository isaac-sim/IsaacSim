name: CI

on:
  push:
    branches:
      - develop
      - 'dev/**'
      - 'release/**'
      - "pull-request/[0-9]+"
      - main
      - 'public-main'
      - develop
      - 'public-develop'
      - staging
  workflow_dispatch:
    inputs:
      run_optional_tests:
        description: "Run optional (non-blocking) test suites"
        type: boolean
        default: false
      run_libraries_linux:
        description: "Run Linux libraries build + test"
        type: boolean
        default: true
      run_windows_build:
        description: "Run Windows build"
        type: boolean
        default: true
      run_windows_tests:
        description: "Run Windows tests (requires Windows build)"
        type: boolean
        default: true
      run_arm_build:
        description: "Run ARM (aarch64) build"
        type: boolean
        default: true
      run_arm_tests:
        description: "Run ARM (aarch64) tests (requires ARM build)"
        type: boolean
        default: true
      run_arm_libraries:
        description: "Run ARM libraries build + test"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  # ===========================================================================
  # Checks
  # ===========================================================================
  checks:
    uses: ./.github/workflows/checks.yml

  # ===========================================================================
  # Build Matrix (Release)
  # ===========================================================================
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            config: release
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      config: ${{ matrix.config }}

  # ===========================================================================
  # Build Matrix (Coverage)
  # ===========================================================================
  build-cov:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            config: release
    uses: ./.github/workflows/build-cov.yml
    with:
      platform: ${{ matrix.platform }}
      config: ${{ matrix.config }}

  # ===========================================================================
  # Test Matrix - Blocking (uses coverage build)
  # ===========================================================================
  test-blocking:
    needs: build-cov
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            config: release
            suite: startuptests
            bucket: ""
          - platform: linux-x86_64
            config: release
            suite: warmuptests
            bucket: ""
          - platform: linux-x86_64
            config: release
            suite: postinstalltests
            bucket: ""
          - platform: linux-x86_64
            config: release
            suite: pythontests
            bucket: asset
          - platform: linux-x86_64
            config: release
            suite: pythontests
            bucket: deprecated
    uses: ./.github/workflows/test.yml
    with:
      platform: ${{ matrix.platform }}
      config: ${{ matrix.config }}
      suite: ${{ matrix.suite }}
      bucket: ${{ matrix.bucket }}
      coverage: true

  # ===========================================================================
  # Test Matrix - Optional (workflow_dispatch only)
  # ===========================================================================
  test-optional:
    needs: build-cov
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_optional_tests }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            config: release
            suite: pythontests
            bucket: core
          - platform: linux-x86_64
            config: release
            suite: pythontests
            bucket: examples_tests
          - platform: linux-x86_64
            config: release
            suite: pythontests
            bucket: replicator
          - platform: linux-x86_64
            config: release
            suite: pythontests
            bucket: ros
          - platform: linux-x86_64
            config: release
            suite: pythontests
            bucket: sensors
          - platform: linux-x86_64
            config: release
            suite: pythontests
            bucket: robot
          - platform: linux-x86_64
            config: release
            suite: pythontests
            bucket: other
          - platform: linux-x86_64
            config: release
            suite: nativepythontests
            bucket: api
          - platform: linux-x86_64
            config: release
            suite: nativepythontests
            bucket: deprecated
          - platform: linux-x86_64
            config: release
            suite: nativepythontests
            bucket: testing
          # TEMPORARILY MOVED TO OPTIONAL
          - platform: linux-x86_64
            config: release
            suite: pythontests
            bucket: utils_gui
          - platform: linux-x86_64
            config: release
            suite: nativepythontests
            bucket: replicator
    uses: ./.github/workflows/test.yml
    with:
      platform: ${{ matrix.platform }}
      config: ${{ matrix.config }}
      suite: ${{ matrix.suite }}
      bucket: ${{ matrix.bucket }}
      coverage: true

  # ===========================================================================
  # Build Libraries (standalone CMake/Pixi graph, no Kit dependency)
  # ===========================================================================
  build-libraries:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_libraries_linux }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            config: release
    uses: ./.github/workflows/build-libraries.yml
    with:
      platform: ${{ matrix.platform }}
      config: ${{ matrix.config }}

  # ===========================================================================
  # Test Libraries - Linux (uses libraries build, needs GPU)
  # ===========================================================================
  test-libraries:
    needs: build-libraries
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.run_libraries_linux) && needs.build-libraries.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            config: release
    uses: ./.github/workflows/test-libraries.yml
    with:
      platform: ${{ matrix.platform }}
      config: ${{ matrix.config }}

  # ===========================================================================
  # Build Matrix (Windows)
  # ===========================================================================
  build-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_windows_build }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            config: release
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit
    with:
      platform: ${{ matrix.platform }}
      config: ${{ matrix.config }}

  # ===========================================================================
  # Test Matrix - Blocking Windows (uses Windows build)
  # ===========================================================================
  test-windows-blocking:
    needs: build-windows
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || (inputs.run_windows_build && inputs.run_windows_tests)) && needs.build-windows.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            config: release
            suite: startuptests
            bucket: ""
          - platform: windows-x86_64
            config: release
            suite: postinstalltests
            bucket: ""
    uses: ./.github/workflows/test-windows.yml
    secrets: inherit
    with:
      platform: ${{ matrix.platform }}
      config: ${{ matrix.config }}
      suite: ${{ matrix.suite }}
      bucket: ${{ matrix.bucket }}

  # ===========================================================================
  # Build Matrix (ARM)
  # ===========================================================================
  build-arm:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_arm_build }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-aarch64
            config: release
    uses: ./.github/workflows/build-arm.yml
    with:
      platform: ${{ matrix.platform }}
      config: ${{ matrix.config }}

  # ===========================================================================
  # Test Matrix - Blocking ARM (uses ARM build)
  # ===========================================================================
  test-arm-blocking:
    needs: build-arm
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || (inputs.run_arm_build && inputs.run_arm_tests)) && needs.build-arm.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-aarch64
            config: release
            suite: startuptests
            bucket: ""
          - platform: linux-aarch64
            config: release
            suite: warmuptests
            bucket: ""
          - platform: linux-aarch64
            config: release
            suite: postinstalltests
            bucket: ""
          - platform: linux-aarch64
            config: release
            suite: pythontests
            bucket: asset
          - platform: linux-aarch64
            config: release
            suite: pythontests
            bucket: deprecated
    uses: ./.github/workflows/test-arm.yml
    with:
      platform: ${{ matrix.platform }}
      config: ${{ matrix.config }}
      suite: ${{ matrix.suite }}
      bucket: ${{ matrix.bucket }}

  # ===========================================================================
  # Build Libraries (ARM)
  # ===========================================================================
  build-libraries-arm:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_arm_libraries }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-aarch64
            config: release
    uses: ./.github/workflows/build-libraries-arm.yml
    with:
      platform: ${{ matrix.platform }}
      config: ${{ matrix.config }}

  # ===========================================================================
  # Test Libraries - ARM (uses ARM libraries build, needs GPU)
  # ===========================================================================
  test-libraries-arm:
    needs: build-libraries-arm
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.run_arm_libraries) && needs.build-libraries-arm.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-aarch64
            config: release
    uses: ./.github/workflows/test-libraries-arm.yml
    with:
      platform: ${{ matrix.platform }}
      config: ${{ matrix.config }}

  # ===========================================================================
  # Combine Coverage (runs after all tests, even if some fail)
  # ===========================================================================
  combine-coverage:
    needs: [build-cov, test-blocking, test-optional]
    if: always() && needs.build-cov.result == 'success'
    uses: ./.github/workflows/combine-coverage.yml
    with:
      platform: linux-x86_64
      config: release
