[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "isaacsim-installer"
dynamic = ["version"]
description = "Isaac Sim installer with an optional terminal frontend"
license = "Apache-2.0"
requires-python = ">=3.11"

[project.scripts]
isaacsim-installer = "isaacsim_installer.cli.main:main"

[project.optional-dependencies]
tui = ["textual>=8.2,<9", "packaging>=24.2"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools]
packages = ["isaacsim_installer", "isaacsim_installer.cli", "isaacsim_installer.core", "isaacsim_installer.tui"]
package-dir = { isaacsim_installer = "." }
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "isaacsim_installer.__version__" }

[tool.setuptools.package-data]
"isaacsim_installer.tui" = ["*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
