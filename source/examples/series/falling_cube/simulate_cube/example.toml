id = "falling_cube.simulate_cube"
title = "Simulate a Cube"
summary = "Author a cube and simulate it falling onto a ground plane."
owners = [
    "isaacsim.foundation.objects",
    "isaacsim.foundation.prims",
    "isaacsim.physics.manager",
    "isaacsim.physics_engines.ovphysx",
]
topics = ["physics", "usd"]

[build]
adapter = "none"

[run]
adapter = "python"
path = "main.py"

[requirements]
system = ["python"]

[[requirements.modules]]
name = "isaacsim_foundation"
surfaces = ["python"]

[[requirements.modules]]
name = "isaacsim_physics"
surfaces = ["python"]

[[requirements.modules]]
name = "isaacsim_physics_engines"
surfaces = ["python"]

[[test]]
name = "default"
path = "test.py"
stdout_contains = ["Falling cube simulation test passed."]
