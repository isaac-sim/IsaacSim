id = "ovgl_viewport.cpp"
title = "OVGL Viewport"
summary = "Load a USD stage into OVStage and inspect it with the interactive OVGL debug viewport."
owners = [
    "isaacsim.foundation.objects",
    "isaacsim.ovgl_viewport.debug",
]
topics = ["rendering", "usd", "viewport"]

[build]
adapter = "cmake"
targets = ["ovgl_viewport_cpp"]

[run]
adapter = "executable"
target = "ovgl_viewport_cpp"

[[test]]
name = "headless"
arguments = ["--headless", "--frames", "1"]
stdout_contains = ["Viewport rendered 1 frame(s)."]
timeout_seconds = 60

[requirements]
system = ["cmake", "cpp", "python", "python_development"]

[[requirements.modules]]
name = "isaacsim_foundation"
surfaces = ["native_sdk"]

[[requirements.modules]]
name = "isaacsim_ovgl_viewport"
surfaces = ["native_sdk"]
