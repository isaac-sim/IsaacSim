id = "falling_cube_ovsim.simulate_cube"
title = "Simulate a Cube"
summary = "Author a cube and simulate it falling onto a ground plane."
owners = [
    "isaacsim.ovsim.api",
    "isaacsim.physics_engines.ovphysx",
]
topics = ["physics", "usd"]

[build]
adapter = "none"

[run]
adapter = "python"
path = "main.py"

[requirements]
system = ["python"]

[[requirements.modules]]
name = "isaacsim_ovsim"
surfaces = ["python"]

[[requirements.modules]]
name = "isaacsim_physics_engines"
surfaces = ["python"]

[[test]]
name = "default"
path = "test.py"
stdout_contains = ["OV SIM falling cube test passed."]
