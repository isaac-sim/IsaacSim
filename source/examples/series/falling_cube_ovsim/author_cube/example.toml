id = "falling_cube_ovsim.author_cube"
title = "Author a Cube"
summary = "Create a stage and author a cube."
owners = ["isaacsim.ovsim.api"]
topics = ["usd"]

[build]
adapter = "none"

[run]
adapter = "python"
path = "main.py"

[requirements]
system = ["python"]

[[requirements.modules]]
name = "isaacsim_ovsim"
surfaces = ["python"]

[[test]]
name = "default"
path = "test.py"
stdout_contains = ["OV SIM cube authoring test passed."]
