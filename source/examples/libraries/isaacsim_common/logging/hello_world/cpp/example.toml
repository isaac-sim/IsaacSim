id = "hello_world.cpp"
title = "C++ Hello World"
summary = "Report a message through the public C++ logging API."
owners = ["isaacsim.common.logging"]
topics = ["logging"]

[build]
adapter = "cmake"
targets = ["hello_world_cpp"]

[run]
adapter = "executable"
target = "hello_world_cpp"

[requirements]
system = ["cmake", "cpp"]

[[requirements.modules]]
name = "isaacsim_common"
surfaces = ["native_sdk"]

[[test]]
name = "default"
stdout_contains = ["[isaacsim.examples.hello_world.cpp] Hello World from C++."]
