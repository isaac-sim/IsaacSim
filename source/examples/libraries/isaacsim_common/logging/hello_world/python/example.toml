id = "hello_world.python"
title = "Python Hello World"
summary = "Report a message through the public Python logging API."
owners = ["isaacsim.common.logging"]
topics = ["logging"]

[build]
adapter = "none"

[run]
adapter = "python"
path = "main.py"

[requirements]
system = ["python"]

[[requirements.modules]]
name = "isaacsim_common"
surfaces = ["python"]

[[test]]
name = "default"
stdout_contains = ["[isaacsim.examples.hello_world.python] Hello World from Python."]
