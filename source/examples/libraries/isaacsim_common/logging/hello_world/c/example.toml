id = "hello_world.c"
title = "C Hello World"
summary = "Report a message through the public C logging API."
owners = ["isaacsim.common.logging"]
topics = ["logging"]

[build]
adapter = "cmake"
targets = ["hello_world_c"]

[run]
adapter = "executable"
target = "hello_world_c"

[requirements]
system = ["cmake", "c"]

[[requirements.modules]]
name = "isaacsim_common"
surfaces = ["native_sdk"]

[[test]]
name = "default"
stdout_contains = ["[isaacsim.examples.hello_world.c] Hello World from C."]
