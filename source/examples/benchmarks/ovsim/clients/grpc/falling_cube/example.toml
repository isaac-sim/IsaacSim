id = "benchmarks.ovsim.clients.grpc.falling_cube"
title = "OV Sim Falling Cube over gRPC"
summary = "Measure completed physics steps and position readback, without rendering."
owners = [
    "isaacsim.ovsim.api",
    "isaacsim.foundation.objects",
    "isaacsim.physics_engines.ovphysx",
    "isaacsim.performance.benchmarking",
    "isaacsim.ovsim.clients.grpc",
    "isaacsim.ovsim.servers.grpc",
]
topics = ["benchmarking", "physics"]

[build]
adapter = "none"

[run]
adapter = "python"
path = "main.py"

[run.server]
adapter = "command"
command = "isaacsim-ovsim-grpc-server"
arguments = ["--listen-address", "127.0.0.1:50051"]

[requirements]
system = ["python"]
modules = [
    { name = "isaacsim_ovsim", surfaces = ["native_sdk", "python"] },
    { name = "isaacsim_foundation", surfaces = ["python"] },
    { name = "isaacsim_physics_engines", surfaces = ["python"] },
    { name = "isaacsim_performance", surfaces = ["python"] },
]

[[test]]
name = "default"
path = "test.py"
timeout_seconds = 120
stdout_contains = ["Falling cube benchmark test passed."]
