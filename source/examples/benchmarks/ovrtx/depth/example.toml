id = "benchmark.ovrtx.depth"
title = "Single-View Depth Sensor Benchmark"
summary = "Measure ovrtx frame times for a ring of simulated stereo depth sensors."
owners = ["isaacsim.performance.benchmarking"]
topics = ["benchmark", "depth", "profiling", "python", "sensors"]

[build]
adapter = "none"

[run]
adapter = "python"
path = "main.py"

[requirements]
python_packages = [
    "numpy==2.5.2",
    "ovrtx==0.5.0.377615",
    "ovstage==0.2.0.377349",
    "warp-lang==1.17.0",
]
system = ["gpu", "python"]
modules = [
    { name = "isaacsim_performance", surfaces = ["python"] },
]

[[test]]
name = "smoke"
path = "test.py"
timeout_seconds = 300
stdout_contains = ["Benchmark smoke test passed."]
