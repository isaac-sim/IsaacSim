[package]
version = "6.2.1"
category = "Simulation"
title = "Isaac Sim Asset Transformer"
description = "Python-only extension providing asset transformation utilities"
keywords = ["isaac", "assets", "transform"]
changelog = "docs/CHANGELOG.md"
readme = "docs/Overview.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

[dependencies]
"omni.usd.libs" = {}

[[python.module]]
path = "pip_prebundle"

[[python.module]]
name = "isaacsim.asset.transformer"

[[python.module]]
name = "isaacsim.asset.transformer.tests"

[[test]]
stdoutFailPatterns.exclude = [
    '*The NumPy module was reloaded*',
    ### test-suite specific args
    "*[isaacsim.asset.transformer.manager] Rule '*' failed*",
    # test_run_still_returns_a_report_when_the_error_sweep_fails forces the
    # composition-error sweep to raise so it can assert the run still reports.
    '*[isaacsim.asset.transformer.manager] Composition error collection failed*',
]

[documentation]
pages = ["docs/Overview.md", "docs/CHANGELOG.md"]
