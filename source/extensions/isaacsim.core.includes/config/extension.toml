[package]
version = "2.9.5"
category = "Internal"
title = "Isaac Sim Common Includes"
description = "Extension containing common isaac sim headers"
keywords = ["isaac", "core", "includes"]
changelog = "docs/CHANGELOG.md"
readme = "docs/Overview.md"
preview_image = "data/preview.png"
icon = "data/icon.png"
writeTarget.kit = true
writeTarget.platform = true

[[test]]
enabled = true
dependencies = [
    "omni.kit.test",
]
cppTests.libraries = [
    "bin/${lib_prefix}isaacsim.core.includes.tests${lib_ext}",
]

stdoutFailPatterns.exclude = [
    '*The NumPy module was reloaded*',
]

[documentation]
pages = ["docs/Overview.md", "docs/CHANGELOG.md"]
