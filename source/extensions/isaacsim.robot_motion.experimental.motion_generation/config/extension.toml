# Extension configuration file.
# Visit the "Extension configuration file (extension.toml)" section for more details:
# https://docs.omniverse.nvidia.com/kit/docs/kit-manual/latest/guide/extensions_advanced.html
#

[core]
reloadable = false
# Load after required extensions with order -100.
order = -97

[package]
version = "7.2.0"
category = "simulation"
title = "motion_generation"
description = "Provides the isaacsim.robot_motion.experimental.motion_generation library in Kit."
keywords = ["motion", "generation", "api", "planning", "kinematics", "trajectory", "libraries"]
changelog = "docs/CHANGELOG.md"
readme = "docs/Overview.md"
preview_image = "data/preview.png"
icon = "data/icon.png"
writeTarget.kit = true
writeTarget.platform = true

[dependencies]
"isaacsim.common" = {}
"isaacsim.core.experimental.objects" = {}
"isaacsim.core.experimental.prims" = {}
"isaacsim.core.experimental.utils" = {}
"isaacsim.robot_motion.schema" = {}

# Motion generation implementation, delivered from the isaacsim-robot-motion wheel.
[[python.module]]
path = "pip_prebundle"

# Kit-only lifecycle adapter overlaid onto the wheel-provided package.
[[python.module]]
name = "isaacsim.robot_motion.experimental.motion_generation.impl.extension"

# Behavioral tests kept in the extension so Kit CI exercises the wheel-provided implementation.
[[python.module]]
name = "isaacsim.robot_motion.experimental.motion_generation.tests"

[[test]]
enabled = true
dependencies = [
    "isaacsim.storage.native",
]

stdoutFailPatterns.exclude = [
    '*The NumPy module was reloaded*',
]

[documentation]
pages = ["docs/Overview.md", "docs/CHANGELOG.md"]
