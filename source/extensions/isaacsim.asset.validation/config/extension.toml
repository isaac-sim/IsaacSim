[package]
version = "2.3.0"
category = "SyntheticData"
title = "Isaac Sim Asset Validation Rules"
description = "Provisions the SimReady foundation validation tiers (core + isaac) and the simready-validate framework for validating Isaac Sim content."
keywords = ["Synthetic", "Data", "Generation", "SDG", "Asset", "Validation"]
changelog = "docs/CHANGELOG.md"
readme = "docs/Overview.md"
preview_image = "data/preview.png"
icon = "data/icon.png"
writeTarget.platform = true # Build separate extensions for Windows and Linux so appropriate libraries are bundled

[dependencies]
"isaacsim.robot.schema" = {}
"omni.asset_validator.core" = {}
"omni.hydra.usdrt_delegate" = {}
"omni.physics" = {}
"omni.physics.physx" = {}
"omni.physx" = {}
"omni.usd" = {}
"omni.usd.schema.omni_lens_distortion" = {}
"omni.usd.schema.omni_sensors" = {}
"omni.usd.schema.physx" = {}

[[python.module]]
name = "isaacsim.asset.validation"

[[python.module]]
name = "isaacsim.asset.validation.tests"

# The concrete validation rules now live in the SimReady foundation tiers
# (simready.foundation.tier_core / .tier_isaac) and are run through the
# usd_validation_nvidia framework. Rather than installing the tier wheels at
# runtime via [python.pipapi] (which breaks: Kit's per-package `pip install
# --target` silently drops the second tier's `simready/foundation/...` payload
# because the shared `simready/` dir already exists -> ModuleNotFoundError), both
# tiers are pre-merged in a single pip pass by deps/pip_simready.toml, symlinked
# into this extension as pip_prebundle by premake5.lua, and added to sys.path
# here as a python module.
[[python.module]]
path = "pip_prebundle"

[documentation]
pages = ["docs/Overview.md"]
