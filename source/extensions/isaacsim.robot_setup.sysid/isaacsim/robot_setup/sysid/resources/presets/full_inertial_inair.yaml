name: full_inertial_inair
description: In-air per-link inertial identification (mass, CoM, log-Cholesky inertia) plus joint drives on the differentiable Newton bridge.
include_basic: true
include_com_offsets: true
include_inertia_log_cholesky: true
include_joint_limit_scales: false
include_per_link_mass: true
optimizer_backend:
  backend: gradient_descent
  gd_learning_rate: 0.05
  gd_num_restarts: 2
simulation:
  engine: newton
  physics_backend: newton
  actuator_runtime: auto
  newton:
    solver: featherstone_diff
    featherstone_substeps: 4
    # Controller class is robot-specific. Set feedforward from the real
    # controller configuration; total measured torque cannot identify its
    # feedback/feedforward decomposition.
    feedforward: none
solver:
  max_iterations: 120
  max_rollout_steps: 600
chunking:
  mode: auto
  train_fraction: 0.8
  min_chunk_seconds: 1.0
residual_weights_mode: auto
residual_weights:
  position_weight: 1.0
  velocity_weight: 0.5
notes:
  - Contact-free protocol; use rich excitation across all joints so per-link inertia is identifiable.
  - Log-Cholesky inertia stays positive definite by construction on the differentiable bridge.
  - Keep training chunks short (multiple shooting) to bound differentiable rollout memory and graph size.
