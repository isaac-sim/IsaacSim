[package]
version = "1.12.2"
category = "Simulation"
title = "Isaac Sim Native Storage"
description = "Provides utilities for accessing Isaac Sim assets from Nucleus servers or S3 buckets, including path resolution, asset downloading, and version verification."
keywords = ["isaac"]
changelog = "docs/CHANGELOG.md"
readme = "docs/Overview.md"
preview_image = "data/preview.png"
icon = "data/icon.png"
writeTarget.kit = true

[dependencies]
"isaacsim.core.version" = {}
"omni.client" = {}

[[python.module]]
name = "isaacsim.storage.native"

[[python.module]]
name = "isaacsim.storage.native.tests"

[settings]
# Default asset root path for Isaac Sim.
persistent.isaac.asset_root.default = "https://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/Isaac/6.2"
# Timeout in seconds for resolving the asset root path.
persistent.isaac.asset_root.timeout = 10.0
# Number of retries for transient asset root connectivity checks.
persistent.isaac.asset_root.retry_attempts = 3
# Initial retry delay in seconds using exponential backoff.
persistent.isaac.asset_root.retry_base_delay = 0.5

# Asset region profiles, selected at startup by the `ISAACSIM_ASSET_REGION_PROFILE`
# environment variable. The extension's default asset root is used when no profile is selected.
# Default asset root for the primary profile.
exts."isaacsim.storage.native".asset_region_profiles.us.asset_root = "https://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/Isaac/6.2"

# S3-compatible endpoint hostname for the regional storage profile.
exts."isaacsim.storage.native".asset_region_profiles.china.endpoint = "simready-cn.s3.oss-cn-shanghai.aliyuncs.com"
# Bucket containing the regional profile's Isaac Sim assets.
exts."isaacsim.storage.native".asset_region_profiles.china.bucket = "simready-cn"
# Object storage region for the regional profile.
exts."isaacsim.storage.native".asset_region_profiles.china.region = "oss-cn-shanghai"
# Reads are served by the regional CDN while list and stat go direct to the bucket.
# Alibaba Cloud OSS ignores a Range extending past EOF and returns the whole object where
# S3 clamps to EOF, which breaks multipart reads above 4 MB; the CDN supplies the header
# that restores standard behavior, so the client does not send it.
exts."isaacsim.storage.native".asset_region_profiles.china.cdn_url = "https://assets.simready.cn/"
# Use the bucket endpoint rather than the CDN for object listings.
exts."isaacsim.storage.native".asset_region_profiles.china.cdn_for_list = false
# Default Isaac Sim asset root for the regional profile.
exts."isaacsim.storage.native".asset_region_profiles.china.asset_root = "https://simready-cn.s3.oss-cn-shanghai.aliyuncs.com/Assets/Isaac/6.2"
# USD asset search service for the regional profile.
exts."isaacsim.storage.native".asset_region_profiles.china.usd_search_endpoint = "https://search.simready.cn/"

[[test]]
timeout = 900
dependencies = [
    "isaacsim.test.docstring",
    "omni.kit.test"
]
args = [
    "--enable",
    "omni.kit.loop-isaac",
    "--reset-user",
    "--vulkan",
    "--/app/asyncRendering=0",
    "--/app/asyncRenderingLowLatency=0",
    "--/app/fastShutdown=1",
    "--/app/file/ignoreUnsavedStage=1",
    "--/app/hydraEngine/waitIdle=0",
    "--/app/player/useFixedTimeStepping=false",
    "--/app/renderer/skipWhileMinimized=0",
    "--/app/renderer/sleepMsOnFocus=0",
    "--/app/renderer/sleepMsOutOfFocus=0",
    "--/app/runLoops/main/manualModeEnabled=true",
    "--/app/runLoops/main/rateLimitEnabled=false",
    "--/app/settings/fabricDefaultStageFrameHistoryCount=3",
    "--/app/settings/persistent=0",
    "--/app/useFabricSceneDelegate=true",
    "--/app/viewport/createCameraModelRep=0",
    "--/crashreporter/skipOldDumpUpload=1",
    "--/exts/omni.usd/locking/onClose=0",
    "--/omni/kit/plugin/syncUsdLoads=1",
    "--/omni/replicator/asyncRendering=0",
    "--/omnihydra/parallelHydraSprimSync=1",
    '--/persistent/app/stage/upAxis="Z"',
    "--/persistent/app/viewport/defaults/tickRate=120",
    "--/persistent/app/viewport/displayOptions=31951",
    "--/persistent/omni/replicator/captureOnPlay=1",
    "--/persistent/omnigraph/updateToUsd=0",
    "--/persistent/physics/visualizationDisplayJoints=0",
    "--/persistent/renderer/startupMessageDisplayed=1",
    "--/persistent/simulation/defaultMetersPerUnit=1.0",
    "--/persistent/simulation/minFrameRate=15",
    "--/renderer/multiGpu/autoEnable=0",
    "--/renderer/multiGpu/enabled=0",
    "--/rtx-transient/dlssg/enabled=0",
    "--/rtx-transient/resourcemanager/enableTextureStreaming=1",
    "--/rtx/descriptorSets=360000",
    "--/rtx/hydra/enableSemanticSchema=1",
    "--/rtx/hydra/materialSyncLoads=1",
    "--/rtx/hydra/supportMultiTickRate=true",
    "--/rtx/materialDb/syncLoads=1",
    "--/rtx/newDenoiser/enabled=1",
    "--/rtx/rendering/perSensorTickTlas=true",
    "--/rtx/reservedDescriptors=900000",
]

stdoutFailPatterns.exclude = [
    '*The NumPy module was reloaded*',
]

[documentation]
pages = ["docs/Overview.md","docs/SETTINGS.md", "docs/CHANGELOG.md"]
