# Extension configuration file.
# Visit the "Extension configuration file (extension.toml)" section for more details:
# https://docs.omniverse.nvidia.com/kit/docs/kit-manual/latest/guide/extensions_advanced.html
#

[core]
reloadable = false
# Load after required extensions with order -100.
order = -97

[package]
version = "1.5.0"
category = "simulation"
title = "cumotion"
description = "Provides the isaacsim.robot_motion.cumotion library in Kit."
keywords = ["motion", "generation", "cumotion", "planning", "rmpflow", "rmp", "trajectory"]
changelog = "docs/CHANGELOG.md"
readme = "docs/Overview.md"
preview_image = "data/preview.png"
icon = "data/icon.png"
writeTarget.kit = true
writeTarget.platform = true

[dependencies]
"isaacsim.common" = {}
"isaacsim.core.experimental.materials" = {}
"isaacsim.core.experimental.objects" = {}
"isaacsim.core.experimental.prims" = {}
"isaacsim.core.experimental.utils" = {}
"isaacsim.robot_motion.experimental.motion_generation" = {}
"isaacsim.robot_motion.schema" = {}

# Add the wheel-provided cuMotion implementation and native runtime to Kit's Python path.
[[python.module]]
path = "pip_prebundle"

# Load the Kit-only lifecycle adapter that configures native library lookup on Windows.
[[python.module]]
name = "isaacsim.robot_motion.cumotion.extension"

# define the Python module for tests
[[python.module]]
name = "isaacsim.robot_motion.cumotion.tests"

[[test]]
name = "startup"
enabled = true

stdoutFailPatterns.exclude = [
    '*The NumPy module was reloaded*',
]

[[test]]
enabled = true

stdoutFailPatterns.exclude = [
    '*The NumPy module was reloaded*',
]

[documentation]
pages = ["docs/Overview.md", "docs/CHANGELOG.md"]
