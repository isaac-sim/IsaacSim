[build-system]
requires = ["scikit-build-core>=1.0.3"]
build-backend = "scikit_build_core.build"

[project]
name = "isaacsim-physics-engines"
dynamic = ["version", "dependencies"]
description = "OvPhysX, Newton, and OVStage providers for the backend-neutral Isaac Sim physics APIs"
requires-python = "==3.12.*"
license = "Apache-2.0"
authors = [{ name = "NVIDIA Corporation" }]
dependencies = [
    "newton[sim]==1.6.1",
    "newton-usd-schemas>=0.5.0,<0.6",
    "ovnewton==0.1.1",
    "ovphysx==0.6.3",
    "ovstage==0.2.0.377349",
    "physx-usd-schemas>=25.11.1,<26",
    "warp-lang>=1.17.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "../../VERSION"
regex = '''^(?P<value>[^\r\n]+)$'''

[[tool.dynamic-metadata]]
provider = { path = "../../packaging", module = "isaacsim_libraries_metadata" }
field = "dependencies"
names = ["isaacsim-physics"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.26"
wheel.cmake = false
wheel.packages = []
wheel.platlib = true
wheel.py-api = "cp312"
wheel.reproducible = true
