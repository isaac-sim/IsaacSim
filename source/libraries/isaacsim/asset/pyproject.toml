[build-system]
requires = ["scikit-build-core>=1.0.3"]
build-backend = "scikit_build_core.build"

[project]
name = "isaacsim-asset"
dynamic = ["version"]
description = "USD asset transformation and importer utilities from NVIDIA Isaac Sim"
requires-python = "==3.12.*"
dependencies = [
    "mujoco-usd-converter==0.5.0",
    "usd-exchange==2.3.0",
    "usd-optimize>=1.1.0",
]
license = "Apache-2.0"
keywords = ["nvidia", "isaac", "sim", "usd", "asset", "transformer", "importer"]
authors = [{ name = "NVIDIA Corporation" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "../../VERSION"
regex = '''^(?P<value>[^\r\n]+)$'''

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.26"
wheel.cmake = false
wheel.packages = []
wheel.platlib = false
wheel.reproducible = true
