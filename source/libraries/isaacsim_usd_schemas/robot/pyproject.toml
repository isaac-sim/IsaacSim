[project]
name = "isaacsim-robot-schema"
dynamic = ["version"]
description = "Isaac Sim USD robot schema helpers and applied schema utilities"
requires-python = "==3.12.*"
dependencies = [
    "usd-exchange==2.3.0",
]
readme = {text = "Isaac Sim USD robot schema helpers and applied schema utilities.", content-type = "text/plain"}
license = "Apache-2.0"
keywords = ["nvidia", "isaac", "sim", "usd", "robot", "schema"]
authors = [
    {name = "NVIDIA Corporation"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[build-system]
requires = ["scikit-build-core>=1.0.3"]
build-backend = "scikit_build_core.build"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "../../VERSION"
regex = '''^(?P<value>[^\r\n]+)$'''

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.26"
wheel.cmake = false
wheel.packages = []
wheel.platlib = false
wheel.reproducible = true

[tool.isaacsim-library]
default-wheel-variant = "usd2505"
wheel-variants = ["usd2505", "usd2511"]
