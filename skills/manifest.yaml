# Source of record for which skills exist, what ships, and how they are grouped.
#
# The skill table in skills/SKILLS.md is generated from this file by
# tools/isaac/pre_merge/generate_skills_index.py; the prose around that table is
# hand-written in SKILLS.md itself. Adding a skill means adding one entry under
# `skills:` below, and the generator fails when a skill on disk has no entry.
#
# The table carries names and categories only. What a skill does, and when to use
# it, lives in that skill's frontmatter `description`, which is what agents route
# on — the index does not restate it.
#
# `audience` and `scope` follow from whether a skill sits under skills/_internal/,
# and the generator rejects entries where they disagree with the path.

# Section order in the generated table. Skills are grouped by their `category`
# below, in the order they appear under `skills:`.
