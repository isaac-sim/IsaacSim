  - title: Mobile robot navigation
  - title: Manipulation
  - title: Sensors and perception
  - title: Synthetic data generation
    cross_refs:
      - skill: mobility-gen
        text: mobile-robot variant
        see: Mobile robot navigation
  - title: Action and event data generation
  - title: Rendering
  - title: USD pipeline
  - title: ROS 2

